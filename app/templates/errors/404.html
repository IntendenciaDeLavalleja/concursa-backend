<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f4f7fb;
            --panel: rgba(255, 255, 255, 0.88);
            --border: rgba(31, 41, 55, 0.08);
            --text: #122033;
            --muted: #607089;
            --primary: #1d4ed8;
            --primary-soft: rgba(29, 78, 216, 0.1);
            --shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(29, 78, 216, 0.12), transparent 32%),
                radial-gradient(circle at bottom right, rgba(14, 165, 233, 0.14), transparent 28%),
                linear-gradient(180deg, #f8fbff 0%, var(--bg) 100%);
            display: grid;
            place-items: center;
            padding: 32px 18px;
        }

        .shell {
            width: min(760px, 100%);
        }

        .card {
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 28px;
            background: var(--panel);
            backdrop-filter: blur(14px);
            box-shadow: var(--shadow);
            padding: 40px;
        }

        .card::before {
            content: "";
            position: absolute;
            inset: 0 auto auto 0;
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, rgba(29, 78, 216, 0.18), transparent 68%);
            pointer-events: none;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 999px;
            background: var(--primary-soft);
            color: var(--primary);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        h1 {
            margin: 18px 0 10px;
            font-size: clamp(34px, 5vw, 56px);
            line-height: 1;
            letter-spacing: -0.04em;
        }

        p {
            margin: 0;
            max-width: 56ch;
            font-size: 17px;
            line-height: 1.7;
            color: var(--muted);
        }

        @media (max-width: 640px) {
            .card {
                padding: 28px 22px;
                border-radius: 22px;
            }

            p {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <main class="shell">
        <section class="card">
            <div class="eyebrow">Error 404</div>
            <h1>Página no encontrada</h1>
            <p>
                La página que intentaste abrir no está disponible.
            </p>
        </section>
    </main>
</body>
</html>
